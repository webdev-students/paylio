<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 1 | JS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h2>JavaScript</h2>
      <nav>
        <a href="#">Login</a>
        <a href="#">Signup</a>
      </nav>
    </header>
    <main>
      <div class="login">
        <input
          type="text"
          name="username"
          id="username"
          placeholder="Username"
        />
        <input
          type="password"
          name="password"
          id="password"
          placeholder="Password"
        />
        <button type="submit">Login</button>
      </div>

      <div class="signup">
        <input
          type="text"
          name="fullname"
          id="fullname"
          placeholder="Type in your full name"
        />
        <input
          type="email"
          name="email"
          id="email"
          placeholder="What's your email address?"
        />
        <input
          type="text"
          name="username"
          id="username"
          placeholder="Choose a username"
        />
        <input
          type="password"
          name="password"
          id="password"
          placeholder="Choose a password"
        />
        <button type="submit">Signup</button>
      </div>
    </main>
  </body>
</html>
