<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intro to JavaScript</title>
    <style>
      body {
        background: linear-gradient(135deg, #222, black);
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
      }
      button,
      input {
        padding: 0.8rem 1.1rem;
        border-radius: 10px;
        border: none;
      }
      button {
        color: #ffffff;
        background: linear-gradient(135deg, cyan, blue);
        cursor: pointer;
      }
      .user_section {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      h3 {
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <div class="user_section">
      <h2>Welcome to JavaScript</h2>
      <h3 id="welcomeMsg"></h3>
    </div>
    <input
      type="text"
      id="user"
      placeholder="What's your name?"
      autocomplete="off"
    />
    <button class="login" onclick="loginAuth()">Login</button>
    <script src="scripts/auth.js"></script>
  </body>
</html>
